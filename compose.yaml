name: material-studio
services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-material_app}
      MYSQL_USER: ${MYSQL_USER:-material_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_demo_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_demo_root_password}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-material_app}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-material_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-local_demo_password}
      DEMO_MODE: ${DEMO_MODE:-true}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_ROOT: /app/data
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
      SIM_CHECK_MS: ${SIM_CHECK_MS:-1500}
      SIM_GEN_MS: ${SIM_GEN_MS:-6000}
      SIM_FINALIZE_MS: ${SIM_FINALIZE_MS:-1500}
      QUEUE_POLL_MS: ${QUEUE_POLL_MS:-500}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - asset-data:/app/data
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        JAVA_API_BASE_URL: ${JAVA_API_BASE_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  asset-data:
